version: 2

project_name: hits

builds:
  - id: hits
    main: ./cmd/hits
    binary: hits
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/impire-io/hits/internal/version.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: hits-mcp
    main: ./cmd/hits-mcp
    binary: hits-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/impire-io/hits/internal/version.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

# One archive per platform: hits (client + up, the whole fleet in one
# process) and hits-mcp (the agent action surface) cover every way of using
# HITS. The standalone fleet binaries stay buildable and return to the
# archive when a production consumer asks (hits-hq decision 0004).
archives:
  - id: hits
    ids: [hits, hits-mcp]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"

release:
  github:
    owner: impire-io
    name: hits
  draft: false
  prerelease: auto
