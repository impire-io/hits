version: 2

project_name: hits

builds:
  - id: hits
    main: ./cmd/hits
    binary: hits
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/impire-io/hits/internal/version.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: hits-mcp
    main: ./cmd/hits-mcp
    binary: hits-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/impire-io/hits/internal/version.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

# One archive per platform: hits (client + up, the whole fleet in one
# process) and hits-mcp (the agent action surface) cover every way of using
# HITS. The standalone fleet binaries stay buildable and return to the
# archive when a production consumer asks (hits-hq decision 0004).
archives:
  - id: hits
    ids: [hits, hits-mcp]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

# One formula installing both binaries from the platform archive. It is
# pushed to impire-io/homebrew-tap on every release — RCs included,
# deliberately: pre-v1 the candidates ARE the releases, and the tap is
# the one-command install path (no Go toolchain, nothing edited).
# Needs the HOMEBREW_TAP_TOKEN repo secret (fine-grained PAT, contents
# read/write on the tap repo) — the workflow passes it through.
brews:
  - name: hits
    ids: [hits]
    repository:
      owner: impire-io
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/impire-io/hits
    description: "Headless, agent-native issue tracking"
    skip_upload: false
    commit_msg_template: "brew: hits {{ .Tag }}"
    commit_author:
      name: hits-release
      email: noreply@impire.io
    install: |
      bin.install "hits"
      bin.install "hits-mcp"
    test: |
      assert_match version.to_s, shell_output("#{bin}/hits version")

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"

release:
  github:
    owner: impire-io
    name: hits
  draft: false
  prerelease: auto
