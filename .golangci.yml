version: "2"

linters:
  # Default set (errcheck, govet, ineffassign, staticcheck, unused) plus a few.
  enable:
    - revive
    - misspell
    - unconvert
    - depguard
  settings:
    depguard:
      # The boundary (specs/017-on-chronicle): contract is the one shared
      # package and imports no other hits package; client imports only
      # contract (and chronicle's client); the adapters speak the client.
      rules:
        contract-is-a-leaf:
          files: ["**/contract/*.go", "!$test"]
          deny:
            - pkg: github.com/impire-io/hits
              desc: the contract package imports no other hits package
        client-speaks-contract-only:
          files: ["**/client/**", "!$test"]
          deny:
            - pkg: github.com/impire-io/hits/internal
              desc: the client packages are the wire surface; they never reach into a service
        adapters-speak-client-only:
          files: ["**/internal/cli/**", "**/internal/mcp/**", "!$test"]
          deny:
            - pkg: github.com/impire-io/hits/internal/node
              desc: there is no fleet; adapters speak the client package
            - pkg: github.com/impire-io/hits/internal/index
              desc: there is no fleet; adapters speak the client package
        cli-and-mcp-stand-apart:
          files: ["**/internal/cli/**", "!$test"]
          deny:
            - pkg: github.com/impire-io/hits/internal/mcp
              desc: the two adapters share the client, never each other
        mcp-and-cli-stand-apart:
          files: ["**/internal/mcp/**", "!$test"]
          deny:
            - pkg: github.com/impire-io/hits/internal/cli
              desc: the two adapters share the client, never each other
        # The connection seam and the fleet-era contexts open connections;
        # speaking over them is a client's job.
        seams-open-connections-only:
          files: ["**/internal/dial/**", "**/internal/connect/**", "!$test"]
          deny:
            - pkg: github.com/impire-io/hits/internal/cli
              desc: a seam never imports the adapters
            - pkg: github.com/impire-io/hits/internal/mcp
              desc: a seam never imports the adapters
        # cmd/ is not an unconstrained zone: each main is pinned to its own
        # adapter.
        cmd-hits-runs-the-cli:
          files: ["**/cmd/hits/*.go"]
          deny:
            - pkg: github.com/impire-io/hits/internal/mcp
              desc: the MCP server has its own main
        cmd-hits-mcp-runs-its-adapter:
          files: ["**/cmd/hits-mcp/*.go"]
          deny:
            - pkg: github.com/impire-io/hits/internal/cli
              desc: this main runs internal/mcp and nothing else
    errcheck:
      # Writing to stdout/stderr and ignoring the (near-impossible) error is idiomatic.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/impire-io/hits
