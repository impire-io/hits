version: "2"

linters:
  # Default set (errcheck, govet, ineffassign, staticcheck, unused) plus a few.
  enable:
    - revive
    - misspell
    - unconvert
    - depguard
  settings:
    depguard:
      # The service boundary (specs/001-item-store-core): contract is the one
      # shared package and imports no other hits package; client imports only
      # contract; services share through contract, never through each other.
      # Each new service adds a rule here denying the other services' trees.
      rules:
        contract-is-a-leaf:
          files: ["**/contract/*.go", "!$test"]
          deny:
            - pkg: github.com/impire-io/hits
              desc: the contract package imports no other hits package
        client-speaks-contract-only:
          files: ["**/client/*.go", "!$test"]
          deny:
            - pkg: github.com/impire-io/hits/internal
              desc: the client package is the wire surface; it never reaches into a service
        node-stands-alone:
          files: ["**/internal/node/**", "!$test"]
          deny:
            - pkg: github.com/impire-io/hits/internal/index
              desc: services never import each other; share through the contract package
            - pkg: github.com/impire-io/hits/internal/cli
              desc: services never import the adapters
            - pkg: github.com/impire-io/hits/internal/mcp
              desc: services never import the adapters
        index-services-stand-alone:
          files: ["**/internal/index/**", "!$test"]
          deny:
            - pkg: github.com/impire-io/hits/internal/node
              desc: services never import each other; share through the contract package
            - pkg: github.com/impire-io/hits/internal/cli
              desc: services never import the adapters
            - pkg: github.com/impire-io/hits/internal/mcp
              desc: services never import the adapters
        adapters-speak-client-only:
          files: ["**/internal/cli/**", "**/internal/mcp/**", "!$test"]
          deny:
            - pkg: github.com/impire-io/hits/internal/node
              desc: adapters reach the fleet through the client package, never a service's internals
            - pkg: github.com/impire-io/hits/internal/index
              desc: adapters reach the fleet through the client package, never a service's internals
    errcheck:
      # Writing to stdout/stderr and ignoring the (near-impossible) error is idiomatic.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/impire-io/hits
